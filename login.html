<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&family=Playwrite+NO:wght@100..400&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <section id="login-card">
            <div class="login-text">
                <h2>Log In To Your Account</h2>
                <p>Welcome Back</p>
            </div>

            <div class="form">
                <form action="dashboard.html">
                    <div class="form-details">
                        <label for="Username">Username:</label>
                        <input type="text" id="Username" name="Username" placeholder="5ydn3y"><br>
                        <div class="password-row">
                            <label for="Password">Password:</label>
                            <a href="#" style="font-size: 0.9em;">Forgot Password?</a>
                        </div>
                        <input type="password" id="Password" name="Password" placeholder="Your Password"><br>
                    </div>
                    <div class="remember-me">
                        <input type="checkbox" id="Remember-me" name="Remember-me" checked>
                        <label for="Remember-me">Remember Me</label>
                    </div>
                    <button type="submit" id="submit-button">Log In</button>
                </form>
            </div>

            <div class="login-text">
                <p>Don't have an account? <a href="signup.html">Create Account</a></p>
            </div>
        </section>

        <script src="login.js"></script>
    </body>
</html>
