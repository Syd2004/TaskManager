<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&family=Playwrite+NO:wght@100..400&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="signup.css">
    </head>
    <body>
        <section id="login-card">
            <div class="login-text">
                <h2>Create New Account</h2>
            </div>

            <div class="form">
                <form id="signup-form">
                    <label for="Username">Username:</label>
                    <input type="text" id="Username" name="Username" placeholder="johndoe" required minlength="3">
                    
                    <label for="Email">Email:</label>
                    <input type="email" id="Email" name="Email" placeholder="johndoe@gmail.com" required>
                    
                    <label for="Password">Password:</label>
                    <input type="password" id="Password" name="Password" placeholder="Create a strong password" required minlength="8">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                    
                    <label for="PasswordConfirm">Confirm Password:</label>
                    <input type="password" id="PasswordConfirm" name="PasswordConfirm" placeholder="Re-enter your password" required>
                    
                    <div class="terms-agreement">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>
                    
                    <button type="submit" id="submit-button">Create Account</button>
                </form>
            </div>

            <div class="login-text">
                <p>Already have an account? <a href="login.html">Log In</a></p>
            </div>
        </section>

        <script src="signup.js"></script>
    </body>
</html>
